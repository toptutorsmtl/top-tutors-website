<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinfolk — Family Tree Builder</title>
<meta name="description" content="A private, offline-first family tree builder. Build, explore, and export your genealogy — all data stays in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --bg-2:#eae7e0; --panel:#ffffff; --panel-2:#faf9f7;
  --ink:#1d2321; --ink-2:#4d5754; --ink-3:#818b88;
  --line:#dcd8d0; --line-2:#e8e5df;
  --accent:#2f6f5e; --accent-2:#3d8a75; --accent-soft:rgba(47,111,94,.10);
  --bronze:#a8763e; --bronze-soft:rgba(168,118,62,.12);
  --male:#4a7ba8; --female:#b06a86; --neutral:#8a8f96;
  --danger:#b3453c; --danger-soft:rgba(179,69,60,.10);
  --warn:#b8862b; --ok:#2f7d55;
  --shadow:0 1px 2px rgba(20,25,24,.06), 0 6px 20px rgba(20,25,24,.07);
  --shadow-lg:0 8px 40px rgba(20,25,24,.16);
  --radius:12px; --radius-sm:8px;
  --rail:264px; --detail:376px; --top:56px;
}
html[data-theme="dark"]{
  --bg:#14181a; --bg-2:#0f1214; --panel:#1c2124; --panel-2:#232a2d;
  --ink:#e8ece9; --ink-2:#a8b2ae; --ink-3:#78827f;
  --line:#2e3639; --line-2:#262d30;
  --accent:#4fa88f; --accent-2:#63c0a6; --accent-soft:rgba(79,168,143,.14);
  --bronze:#c99a5e; --bronze-soft:rgba(201,154,94,.14);
  --male:#6d9ecb; --female:#cf8ba6; --neutral:#98a0a6;
  --danger:#e07a70; --danger-soft:rgba(224,122,112,.14);
  --warn:#d8a545; --ok:#5cbb87;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.serif{font-family:'Fraunces','Iowan Old Style',Georgia,serif}

/* ─────────── App shell ─────────── */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{
  height:var(--top);flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;padding-right:10px;margin-right:2px;flex:0 0 auto}
.brand-mark{width:28px;height:28px;flex:0 0 auto}
.brand-name{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;letter-spacing:-.01em}
.tree-name{
  font-weight:600;font-size:14px;padding:5px 9px;border-radius:var(--radius-sm);
  border:1px solid transparent;background:transparent;min-width:80px;max-width:230px;
}
.tree-name:hover{border-color:var(--line);background:var(--panel-2)}
.tree-name:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.spacer{flex:1 1 auto}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;
  border-radius:var(--radius-sm);color:var(--ink-2);font-size:13px;font-weight:500;
  border:1px solid transparent;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;
}
.tbtn:hover{background:var(--bg-2);color:var(--ink)}
.tbtn[disabled]{opacity:.35;pointer-events:none}
.tbtn.primary{background:var(--accent);color:#fff;font-weight:600}
.tbtn.primary:hover{background:var(--accent-2);color:#fff}
.tbtn.icon{padding:0;width:32px;justify-content:center}
.tbtn svg{width:16px;height:16px;flex:0 0 auto}
.tsep{width:1px;height:22px;background:var(--line);margin:0 3px;flex:0 0 auto}
.body{flex:1 1 auto;display:flex;min-height:0;position:relative}

/* ─────────── Left rail ─────────── */
.rail{
  width:var(--rail);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:20;
}
.rail-tabs{display:flex;padding:8px 8px 0;gap:2px;border-bottom:1px solid var(--line)}
.rail-tab{
  flex:1;padding:7px 4px 9px;font-size:12px;font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0;
}
.rail-tab:hover{color:var(--ink-2);background:var(--panel-2)}
.rail-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.rail-body{flex:1 1 auto;overflow-y:auto;min-height:0}
.rail-pane{display:none;padding:10px}
.rail-pane.on{display:block}
.searchwrap{position:relative;margin-bottom:8px}
.searchwrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.field{
  width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--panel-2);font-size:13px;transition:border-color .12s,box-shadow .12s;
}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
.field.with-icon{padding-left:30px}
textarea.field{height:auto;min-height:66px;padding:8px 10px;resize:vertical;line-height:1.5}
select.field{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.rowfilter{display:flex;gap:6px;margin-bottom:8px}
.rowfilter .field{height:30px;font-size:12px}
.plist{display:flex;flex-direction:column;gap:1px}
.pitem{
  display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius-sm);
  text-align:left;width:100%;transition:background .1s;
}
.pitem:hover{background:var(--bg-2)}
.pitem.on{background:var(--accent-soft)}
.pitem.on .pitem-name{color:var(--accent)}
.avatar{
  width:30px;height:30px;border-radius:50%;flex:0 0 auto;object-fit:cover;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;
  color:#fff;background:var(--neutral);letter-spacing:.02em;overflow:hidden;
}
.avatar.m{background:var(--male)} .avatar.f{background:var(--female)}
.avatar.lg{width:56px;height:56px;font-size:19px}
.pitem-txt{min-width:0;flex:1}
.pitem-txt{display:block}
.pitem-name{display:block;font-size:13px;font-weight:550;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem-sub{display:block;font-size:11.5px;line-height:1.35;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12.5px;line-height:1.6}
.empty strong{display:block;color:var(--ink-2);font-size:13px;margin-bottom:3px}

/* ─────────── Canvas ─────────── */
.stage{flex:1 1 auto;position:relative;min-width:0;background:var(--bg);overflow:hidden}
.stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0);
  background-size:22px 22px;
}
#chart{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;user-select:none}
#chart.dragging{cursor:grabbing}
.chartbar{
  position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;align-items:center;
  z-index:10;pointer-events:none;flex-wrap:wrap;
}
.chartbar>*{pointer-events:auto}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:2px;box-shadow:var(--shadow)}
.seg button{padding:5px 11px;font-size:12.5px;font-weight:550;border-radius:6px;color:var(--ink-2)}
.seg button:hover{color:var(--ink);background:var(--bg-2)}
.seg button.on{background:var(--accent);color:#fff}
.pill{
  display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:4px 10px;font-size:12.5px;box-shadow:var(--shadow);color:var(--ink-2);
}
.pill label{font-weight:550;color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.pill input[type=range]{width:74px;accent-color:var(--accent)}
.pill input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
.zoomer{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:5px;z-index:10}
.zbtn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
  color:var(--ink-2);box-shadow:var(--shadow);
}
.zbtn:hover{color:var(--accent);border-color:var(--accent)}
.zbtn svg{width:15px;height:15px}
.legend{
  position:absolute;bottom:16px;left:16px;z-index:10;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:8px 11px;box-shadow:var(--shadow);font-size:11.5px;color:var(--ink-2);
}
.legend div{display:flex;align-items:center;gap:6px;margin-top:4px}
.legend div:first-child{margin-top:0}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.stage-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:24px;z-index:5;
}
.stage-empty h2{font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;letter-spacing:-.02em}
.stage-empty p{color:var(--ink-2);max-width:400px;font-size:13.5px}
.stage-empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage-empty.hidden{display:none}

/* SVG chart pieces */
.node{cursor:pointer}
.node .card-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.25}
.node:hover .card-bg{stroke:var(--accent-2)}
.node.sel .card-bg{stroke:var(--accent);stroke-width:2.25}
.node.focus .card-bg{stroke:var(--bronze);stroke-width:2.25}
.node .nm{fill:var(--ink);font-size:13px;font-weight:600}
.node .dt{fill:var(--ink-2);font-size:11px}
.node .xt{fill:var(--ink-3);font-size:10px}
.node .ini{fill:#fff;font-size:12px;font-weight:600;text-anchor:middle}
.node.dim{opacity:.42}
.ghost .card-bg{fill:none;stroke:var(--ink-3);stroke-width:1.25;stroke-dasharray:4 4;opacity:.75}
.ghost:hover .card-bg{stroke:var(--accent);opacity:1}
.ghost text{fill:var(--ink-3);font-size:11.5px;font-weight:550}
.ghost:hover text{fill:var(--accent)}
.lnk{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lnk.union{stroke:var(--bronze);stroke-width:1.8}
.lnk.hot{stroke:var(--accent);stroke-width:2.4}
.udot{fill:var(--bronze)}
.uyr{fill:var(--ink-3);font-size:9.5px;text-anchor:middle}
.gen-band{fill:var(--ink);opacity:.022}
.gen-label{fill:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* ─────────── Detail panel ─────────── */
.detail{
  width:var(--detail);flex:0 0 auto;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:20;
}
.detail.hidden{display:none}
.dhead{padding:14px 14px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dhead-txt{min-width:0;flex:1}
.dhead h2{font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:600;line-height:1.25;letter-spacing:-.01em;word-break:break-word}
.dhead .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.photo-btn{position:relative;flex:0 0 auto;border-radius:50%}
.photo-btn .cam{
  position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);
}
.photo-btn:hover .cam{color:var(--accent);border-color:var(--accent)}
.photo-btn .cam svg{width:11px;height:11px}
.dtabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
.dtab{padding:6px 9px 8px;font-size:12.5px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
.dtab:hover{color:var(--ink-2)}
.dtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.dbody{flex:1 1 auto;overflow-y:auto;padding:14px;min-height:0}
.dpane{display:none} .dpane.on{display:block}
.grp{margin-bottom:16px}
.grp-h{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;
}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fl{display:block;font-size:11.5px;font-weight:550;color:var(--ink-2);margin-bottom:3px}
.fw{margin-bottom:8px}
.hint{font-size:11px;color:var(--ink-3);margin-top:3px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;padding:4px 0}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.relrow{
  display:flex;align-items:center;gap:9px;padding:6px;border-radius:var(--radius-sm);
  border:1px solid var(--line-2);margin-bottom:5px;background:var(--panel-2);
}
.relrow .pitem-txt{cursor:pointer}
.relrow .tag{
  font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px;background:var(--bg-2);
  color:var(--ink-3);text-transform:capitalize;flex:0 0 auto;
}
.relrow .x{width:22px;height:22px;border-radius:5px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.relrow .x:hover{background:var(--danger-soft);color:var(--danger)}
.relrow .x svg{width:13px;height:13px}
.addbtn{
  width:100%;padding:7px;border:1px dashed var(--line);border-radius:var(--radius-sm);
  color:var(--ink-3);font-size:12.5px;font-weight:550;display:flex;align-items:center;justify-content:center;gap:6px;
}
.addbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addbtn svg{width:14px;height:14px}
.dfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{
  height:34px;padding:0 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  border:1px solid var(--line);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:.12s;background:var(--panel);
}
.btn:hover{background:var(--bg-2);color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.dgr{color:var(--danger);border-color:transparent}
.btn.dgr:hover{background:var(--danger-soft)}
.btn.wide{width:100%}
.btn svg{width:15px;height:15px}
.evrow{border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px;margin-bottom:7px;background:var(--panel-2)}
.evrow .top{display:flex;gap:6px;margin-bottom:6px}
.evrow .top .field{height:30px;font-size:12.5px}

/* ─────────── Stats / checks ─────────── */
.stat{background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px 10px}
.stat .n{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;line-height:1.1}
.stat .l{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:flex;align-items:center;gap:7px;font-size:12px}
.bar .bl{display:block;width:74px;flex:0 0 auto;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt{display:block;flex:1;height:7px;background:var(--bg-2);border-radius:4px;overflow:hidden}
.bar .bf{display:block;height:100%;min-width:2px;background:var(--accent);border-radius:4px}
.bar .bv{display:block;width:30px;text-align:right;color:var(--ink-3);font-size:11px;flex:0 0 auto}
.issue{
  display:flex;gap:8px;padding:8px 9px;border:1px solid var(--line-2);border-radius:var(--radius-sm);
  margin-bottom:6px;background:var(--panel-2);text-align:left;width:100%;
}
.issue:hover{border-color:var(--accent)}
.issue .dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.issue.err .dot{background:var(--danger)} .issue.warn .dot{background:var(--warn)} .issue.info .dot{background:var(--accent)}
.issue .t{font-size:12.5px;font-weight:600;line-height:1.35}
.issue .d{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin-top:1px}

/* ─────────── Overlays ─────────── */
.scrim{position:fixed;inset:0;background:rgba(15,20,19,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
.scrim.hidden{display:none}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:760px}
.mhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead h3{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600}
.mhead p{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.mbody{padding:16px 18px;overflow-y:auto;flex:1 1 auto;min-height:0}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{width:28px;height:28px;border-radius:6px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.xbtn:hover{background:var(--bg-2);color:var(--ink)}
.xbtn svg{width:16px;height:16px}
.menu{
  position:fixed;z-index:110;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow-lg);padding:5px;min-width:186px;
}
.menu.hidden{display:none}
.menu button{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;
  font-size:13px;color:var(--ink-2);text-align:left;
}
.menu button:hover{background:var(--bg-2);color:var(--ink)}
.menu button.dgr:hover{background:var(--danger-soft);color:var(--danger)}
.menu button svg{width:15px;height:15px;flex:0 0 auto;opacity:.75}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
.menu .mlabel{padding:5px 9px 3px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);z-index:200;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:550;
  box-shadow:var(--shadow-lg);transition:transform .25s cubic-bezier(.2,.8,.3,1);max-width:88vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.picker-list{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin-top:8px}
.kbd{
  display:inline-block;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
  background:var(--panel-2);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2);
}
.shortcut-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   Kinfolk — a single-file family tree builder.
   Data model follows the GEDCOM lineage-linked shape: individuals (people)
   and families (unions). Modelling unions separately is what makes
   remarriages, half-siblings and step-children representable.
   ══════════════════════════════════════════════════════════════════════════ */

/* ─── tiny helpers ─────────────────────────────────────────────────────── */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uniq = a => Array.from(new Set(a));
const debounce = (fn, ms) => { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; };

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ─── dates ────────────────────────────────────────────────────────────────
   Genealogy dates are frequently partial ("1890") or fuzzy ("abt 1890").
   We keep the user's raw text and derive a structured value for sorting,
   age maths and GEDCOM output. Never silently rewrite what was typed.
   ──────────────────────────────────────────────────────────────────────── */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_L = MON.map(m => m.toLowerCase());
const QUALS = [
  [/^(abt|about|circa|ca|c|~)\.?\s+/i, 'about'],
  [/^(bef|before|<)\.?\s*/i, 'before'],
  [/^(aft|after|>)\.?\s*/i, 'after'],
  [/^(est|estimated)\.?\s+/i, 'estimated'],
  [/^(cal|calculated)\.?\s+/i, 'calculated']
];

function parseDate(raw) {
  if (!raw) return null;
  let s = String(raw).trim();
  if (!s) return null;
  let qual = '';
  for (const [re, name] of QUALS) { if (re.test(s)) { qual = name; s = s.replace(re, '').trim(); break; } }
  // "bet 1890 and 1895" → anchor on the first date, keep the text intact
  const bet = s.match(/^(?:bet|between)\.?\s+(.+?)\s+(?:and|-|–)\s+(.+)$/i);
  if (bet) { const a = parseDate(bet[1]); if (a) return Object.assign({}, a, { qual: 'between', raw: raw }); }
  let y = null, m = null, d = null;
  let mt;
  if ((mt = s.match(/^(\d{3,4})-(\d{1,2})-(\d{1,2})$/)))      { y = +mt[1]; m = +mt[2]; d = +mt[3]; }
  else if ((mt = s.match(/^(\d{3,4})-(\d{1,2})$/)))            { y = +mt[1]; m = +mt[2]; }
  else if ((mt = s.match(/^(\d{3,4})$/)))                      { y = +mt[1]; }
  else if ((mt = s.match(/^(\d{1,2})\s+([a-z]{3,9})\.?,?\s+(\d{3,4})$/i))) { d = +mt[1]; m = monNum(mt[2]); y = +mt[3]; }
  else if ((mt = s.match(/^([a-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{3,4})$/i)))  { m = monNum(mt[1]); d = +mt[2]; y = +mt[3]; }
  else if ((mt = s.match(/^([a-z]{3,9})\.?,?\s+(\d{3,4})$/i)))              { m = monNum(mt[1]); y = +mt[2]; }
  else if ((mt = s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{3,4})$/)))         {
    // Ambiguous slash form: if the first part cannot be a month, read it as day-first.
    if (+mt[1] > 12) { d = +mt[1]; m = +mt[2]; } else { m = +mt[1]; d = +mt[2]; }
    y = +mt[3];
  }
  else if ((mt = s.match(/^(\d{1,2})[/.](\d{3,4})$/)))                      { m = +mt[1]; y = +mt[2]; }
  else { const any = s.match(/(\d{3,4})/); if (any) { y = +any[1]; } }
  if (y == null || !isFinite(y)) return null;
  if (m != null && (m < 1 || m > 12)) { m = null; d = null; }
  if (d != null && (d < 1 || d > 31)) d = null;

    if (sp && P(sp) && !seen.has(sp)) { seen.add(sp); row.push({ id: sp, fam: f.id }); idx = row.length - 1; }

    meta.push({ f: f, spIdx: idx });
  });
  const rowW = row.length * CARD_W + (row.length - 1) * HGAP;

  // Children, grouped by union
  const groups = meta.map(m => ({
    m: m,
    kids: depth > 0 ? m.f.children.filter(c => P(c.id) && !seen.has(c.id)).map(c => buildDescendants(c.id, depth - 1, seen)) : []
  }));
  let kidsW = 0;
  groups.forEach(g => {
    if (!g.kids.length) return;
    const w = g.kids.reduce((s, k) => s + k.w, 0) + (g.kids.length - 1) * HGAP;
    g.w = w; kidsW += w + UGAP;
  });
  if (kidsW > 0) kidsW -= UGAP;

  const w = Math.max(rowW, kidsW);
  const rowX = (w - rowW) / 2;
  row.forEach((r, i) => { const x = rowX + i * (CARD_W + HGAP); items.push(card(r.id, { x: x, y: 0, cx: x + CARD_W / 2 })); });
  const anchor = rowX + CARD_W / 2;

  let kidX = (w - kidsW) / 2;
  groups.forEach((g, i) => {
    const m = g.m, selfCx = rowX + CARD_W / 2;
    let dropX = selfCx, dropY = CARD_H;
    if (m.spIdx > 0) {
      const spCx = rowX + m.spIdx * (CARD_W + HGAP) + CARD_W / 2;
      const yLine = CARD_H + 13 + i * 9;
      links.push({ cls: 'lnk union', pts: [[selfCx, CARD_H], [selfCx, yLine], [spCx, yLine], [spCx, CARD_H]] });
      dropX = (selfCx + spCx) / 2; dropY = yLine;
      items.push({ kind: 'union', x: dropX, y: dropY, label: marriageYear(m.f), fam: m.f.id });
    }
    if (!g.kids.length) return;
    const busY = ROW - 30;
    g.kids.forEach((k, j) => {
      if (j) kidX += HGAP;
      shiftBlock(k, kidX, ROW);
      kidX += k.w;
      links.push({ cls: 'lnk' + (relOfChild(m.f, k.rootId) !== 'birth' ? ' dashed' : ''), pts: [[dropX, dropY], [dropX, busY], [k.anchor, busY], [k.anchor, ROW]] });
      mergeBlock({ items: items, links: links }, k);
    });
    kidX += UGAP;
  });

  return { items: items, links: links, w: w, anchor: anchor, rootId: pid, rowRight: rowX + rowW - CARD_W };
}

/** Generations above a person. `drawSelf` false leaves room for a card drawn elsewhere. */
function ancBlock(pid, depth, seen, drawSelf) {
  const items = [], links = [];
  let subBlocks = [], subW = 0, ghost = false;
  if (depth > 0 && !seen.has(pid)) {
    seen.add(pid);
    const par = orderedParents(pid);
    if (par.length) {
      subBlocks = par.map(p => ancBlock(p, depth - 1, seen, true));
      let x = 0;
      subBlocks.forEach((b, i) => { if (i) x += HGAP; shiftBlock(b, x, 0); x += b.w; });
      subW = x;
    } else if (prefs.ghosts) { ghost = true; subW = CARD_W; }
  }
  const w = Math.max(CARD_W, subW);
  const selfX = (w - CARD_W) / 2, selfCx = selfX + CARD_W / 2;
  if (drawSelf) items.push(card(pid, { x: selfX, y: 0, cx: selfCx }));

  if (subW > 0) {
    const dx = (w - subW) / 2, dy = -ROW;
    const busY = -30;
    if (ghost) {
      items.push({ kind: 'ghost', x: dx, y: dy + CARD_H - GHOST_H, w: CARD_W, h: GHOST_H, target: pid });
      links.push({ cls: 'lnk dashed', pts: [[dx + CARD_W / 2, dy + CARD_H], [dx + CARD_W / 2, busY], [selfCx, busY], [selfCx, 0]] });
    } else {
      subBlocks.forEach(b => shiftBlock(b, dx, dy));
      let dropX, dropY;
      if (subBlocks.length >= 2) {
        const a = subBlocks[0].anchor, b2 = subBlocks[1].anchor;
        const yLine = dy + CARD_H + 13;
        links.push({ cls: 'lnk union', pts: [[a, dy + CARD_H], [a, yLine], [b2, yLine], [b2, dy + CARD_H]] });
        dropX = (a + b2) / 2; dropY = yLine;
        const fam = famcOf(pid)[0];
        if (fam) items.push({ kind: 'union', x: dropX, y: dropY, label: marriageYear(fam), fam: fam.id });
      } else { dropX = subBlocks[0].anchor; dropY = dy + CARD_H; }
      links.push({ cls: 'lnk', pts: [[dropX, dropY], [dropX, busY], [selfCx, busY], [selfCx, 0]] });
      subBlocks.forEach(b => mergeBlock({ items: items, links: links }, b));
    }
  }
  return { items: items, links: links, w: w, anchor: selfCx, busY: -30 };
}

/** Assemble the whole chart for the current mode. */
function buildChart() {
  const fid = T.focus && P(T.focus) ? T.focus : Object.keys(T.people)[0];
  if (!fid) return null;
  const mode = prefs.mode;
  const up = mode === 'descendants' ? 0 : prefs.up;
  const down = mode === 'ancestors' ? 0 : prefs.down;

  const desc = buildDescendants(fid, down, new Set());
  const chart = { items: desc.items.slice(), links: desc.links.slice() };
  const focusCx = desc.anchor;

  if (up > 0) {
    const anc = ancBlock(fid, up, new Set(), false);
    shiftBlock(anc, focusCx - anc.anchor, 0);
    mergeBlock(chart, anc);
  }

  // Siblings share the focus row, ordered by birth around the focus person.
  if (prefs.sibs && mode !== 'descendants') {
    const sibs = siblingsOf(fid);
    const fk = dateKey(P(fid).birth.date);
    const withKey = sibs.map(s => ({ s: s, k: dateKey(P(s.id).birth.date) }));
    withKey.sort((a, b) => (a.k == null ? 1 : b.k == null ? -1 : a.k - b.k));
    const left = [], right = [];
    withKey.forEach(o => { (o.k != null && fk != null && o.k > fk ? right : left).push(o.s); });
    let x = focusCx - CARD_W / 2;
    left.slice().reverse().forEach(s => {
      x -= (CARD_W + HGAP);
      chart.items.push(card(s.id, { x: x, y: 0, cx: x + CARD_W / 2, sib: s.kind }));
      if (up > 0) chart.links.push({ cls: 'lnk' + (s.kind === 'half' ? ' dashed' : ''), pts: [[x + CARD_W / 2, -30], [x + CARD_W / 2, 0]] });
      if (up > 0) chart.links.push({ cls: 'lnk', pts: [[x + CARD_W / 2, -30], [focusCx, -30]] });
    });
    let rx = desc.rowRight;
    right.forEach(s => {
      rx += (CARD_W + HGAP);
      chart.items.push(card(s.id, { x: rx, y: 0, cx: rx + CARD_W / 2, sib: s.kind }));
      if (up > 0) chart.links.push({ cls: 'lnk' + (s.kind === 'half' ? ' dashed' : ''), pts: [[rx + CARD_W / 2, -30], [rx + CARD_W / 2, 0]] });
      if (up > 0) chart.links.push({ cls: 'lnk', pts: [[rx + CARD_W / 2, -30], [focusCx, -30]] });
    });
  }

  // Offer an "add parents" hint above the focus person even at depth 0.
  if (prefs.ghosts && up === 0 && mode === 'descendants' && !parentsOf(fid).length) {
    const gx = focusCx - CARD_W / 2;
    chart.items.push({ kind: 'ghost', x: gx, y: -ROW + CARD_H - GHOST_H, w: CARD_W, h: GHOST_H, target: fid });
    chart.links.push({ cls: 'lnk dashed', pts: [[focusCx, -ROW + CARD_H], [focusCx, 0]] });
  }

  // Normalise into positive space with a margin.
  const M = 60;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  chart.items.forEach(i => {
    const w = i.w || 0, h = i.h || 0;
    minX = Math.min(minX, i.x - (i.kind === 'union' ? 20 : 0));
    maxX = Math.max(maxX, i.x + (i.kind === 'union' ? 20 : w));
    minY = Math.min(minY, i.y - (i.kind === 'union' ? 14 : 0));
    maxY = Math.max(maxY, i.y + (i.kind === 'union' ? 8 : h));
  });
  if (!isFinite(minX)) return null;
  const dx = M - minX, dy = M - minY;
  shiftBlock(chart, dx, dy);
  chart.width = (maxX - minX) + M * 2;
  chart.height = (maxY - minY) + M * 2;
  chart.focusCx = focusCx + dx;
  chart.focusId = fid;
  return chart;
}

/* ─── chart rendering ─────────────────────────────────────────────────── */
let view = { x: 0, y: 0, k: 1 };
let CHART = null;

function trunc(s, px, fs) {
  s = String(s == null ? '' : s);
  const max = Math.floor(px / (fs * 0.53));
  return s.length > max ? s.slice(0, Math.max(1, max - 1)) + '…' : s;
}
function pathOf(pts) { return pts.map((p, i) => (i ? 'L' : 'M') + Math.round(p[0] * 10) / 10 + ' ' + Math.round(p[1] * 10) / 10).join(' '); }
function sexColor(p) { return p && p.sex === 'M' ? 'var(--male)' : p && p.sex === 'F' ? 'var(--female)' : 'var(--neutral)'; }

function renderChart(keepView) {
  const svg = $('#chart'), vp = $('#viewport');
  CHART = buildChart();
  $('#stage-empty').classList.toggle('hidden', !!CHART);
  if (!CHART) { vp.innerHTML = ''; return; }

  const gens = {};
  CHART.items.forEach(i => { if (i.kind === 'card') gens[Math.round(i.y)] = true; });
  const rows = Object.keys(gens).map(Number).sort((a, b) => a - b);
  const focusY = CHART.items.filter(i => i.kind === 'card' && i.id === CHART.focusId).map(i => i.y)[0] || 0;

  let out = '';
  // generation bands
  rows.forEach((y, i) => {
    if (i % 2) out += '<rect class="gen-band" x="0" y="' + (y - 16) + '" width="' + CHART.width + '" height="' + (CARD_H + 32) + '" rx="10"/>';
    out += '<text class="gen-label" x="10" y="' + (y - 18) + '">' + esc(genLabel(Math.round((focusY - y) / ROW))) + '</text>';
  });
  CHART.links.forEach(l => { out += '<path class="' + l.cls.replace('dashed', '') + '" ' + (/dashed/.test(l.cls) ? 'stroke-dasharray="5 4" ' : '') + 'd="' + pathOf(l.pts) + '"/>'; });
  CHART.items.forEach((i, n) => {
    if (i.kind === 'union') {
      out += '<circle class="udot" cx="' + i.x + '" cy="' + i.y + '" r="4"/>';
      if (i.label) out += '<text class="uyr" x="' + i.x + '" y="' + (i.y - 8) + '">' + esc(i.label) + '</text>';
    } else if (i.kind === 'ghost') {
      out += '<g class="node ghost" data-ghost="' + esc(i.target) + '" transform="translate(' + i.x + ',' + i.y + ')">'
           + '<rect class="card-bg" width="' + i.w + '" height="' + i.h + '" rx="9"/>'
           + '<text x="' + (i.w / 2) + '" y="' + (i.h / 2 + 4) + '" text-anchor="middle">+  Add parents</text></g>';
    } else {
      out += nodeSVG(i, n);
    }
  });
  vp.innerHTML = out;

  if (!keepView) fitView();
  else applyView();
}
function genLabel(g) {
  const up = ['This generation', 'Parents', 'Grandparents', 'Great-grandparents', '2× great-grandparents', '3× great-grandparents', '4× great-grandparents', '5× great-grandparents', '6× great-grandparents', '7× great-grandparents'];
  const dn = ['This generation', 'Children', 'Grandchildren', 'Great-grandchildren', '2× great-grandchildren', '3× great-grandchildren', '4× great-grandchildren', '5× great-grandchildren'];
  return g >= 0 ? (up[g] || (g + ' generations up')) : (dn[-g] || (-g + ' generations down'));
}
function nodeSVG(i, n) {
  const p = P(i.id); if (!p) return '';
  const cls = ['node'];
  if (i.id === sel) cls.push('sel');
  if (i.id === CHART.focusId) cls.push('focus');
  const cid = 'cp' + n;
  const life = lifespan(p);
  const dead = isDeceased(p);
  let extra = p.birth.place || p.occupation || '';
  if (i.sib === 'half') extra = 'half-sibling' + (extra ? ' · ' + extra : '');
  let g = '<g class="' + cls.join(' ') + '" data-id="' + esc(i.id) + '" transform="translate(' + i.x + ',' + i.y + ')">'
        + '<rect class="card-bg" width="' + CARD_W + '" height="' + CARD_H + '" rx="11"/>'
        + '<rect x="1.5" y="1.5" width="5" height="' + (CARD_H - 3) + '" rx="2.5" fill="' + sexColor(p) + '"/>';
  if (p.photo) {
    g += '<clipPath id="' + cid + '"><circle cx="38" cy="39" r="22"/></clipPath>'
       + '<image href="' + esc(p.photo) + '" x="16" y="17" width="44" height="44" preserveAspectRatio="xMidYMid slice" clip-path="url(#' + cid + ')"/>'
       + '<circle cx="38" cy="39" r="22" fill="none" stroke="' + sexColor(p) + '" stroke-width="1.5" opacity=".55"/>';
  } else {
    g += '<circle cx="38" cy="39" r="22" fill="' + sexColor(p) + '" opacity=".92"/>'
       + '<text class="ini" x="38" y="44">' + esc(initials(p)) + '</text>';
  }
  g += '<text class="nm" x="70" y="30">' + esc(trunc(fullName(p), 132, 13)) + '</text>'
     + '<text class="dt" x="70" y="48">' + esc((dead ? '† ' : '') + trunc(life || '—', 128, 11)) + '</text>'
     + (extra ? '<text class="xt" x="70" y="63">' + esc(trunc(extra, 138, 10)) + '</text>' : '')
     + '</g>';
  return g;
}

/* ─── pan / zoom ──────────────────────────────────────────────────────── */
function applyView() { $('#viewport').setAttribute('transform', 'translate(' + view.x + ',' + view.y + ') scale(' + view.k + ')'); }
function stageSize() { const r = $('#stage').getBoundingClientRect(); return { w: r.width, h: r.height }; }
function fitView() {
  if (!CHART) return;
  const s = stageSize();
  const k = clamp(Math.min(s.w / CHART.width, s.h / CHART.height), 0.12, 1.15);
  view.k = k;
  view.x = (s.w - CHART.width * k) / 2;
  view.y = (s.h - CHART.height * k) / 2;
  applyView();
}
function centreOn(id, k) {
  if (!CHART) return;
  const it = CHART.items.filter(i => i.kind === 'card' && i.id === id)[0];
  if (!it) return fitView();
  const s = stageSize();
  view.k = k || clamp(view.k, 0.5, 1.1);
  view.x = s.w / 2 - (it.x + CARD_W / 2) * view.k;
  view.y = s.h / 2 - (it.y + CARD_H / 2) * view.k;
  applyView();
}
function zoomBy(f, cx, cy) {
  const s = stageSize();
  cx = cx == null ? s.w / 2 : cx; cy = cy == null ? s.h / 2 : cy;
  const k2 = clamp(view.k * f, 0.08, 3);
  view.x = cx - (cx - view.x) * (k2 / view.k);
  view.y = cy - (cy - view.y) * (k2 / view.k);
  view.k = k2; applyView();
}

/* ─── path helpers for bound fields ───────────────────────────────────── */
function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) {
  const ks = path.split('.'); const last = ks.pop();
  const t = ks.reduce((a, k) => (a[k] = a[k] || {}), o);
  t[last] = v;
}

/** Merged personal + family events, chronologically. */
function timelineFor(id) {
  const p = P(id); if (!p) return [];
  const out = [];
  const push = (date, title, place) => {
    let age = date && p.birth.date ? yearsBetween(p.birth.date, date) : null;
    if (age != null && (age < 0 || age > 125)) age = null;
    out.push({ k: dateKey(date), when: date ? fmtDate(date) : '', title: title, place: place || '', age: age });
  };
  if (p.birth.date || p.birth.place) push(p.birth.date, 'Born', p.birth.place);
  siblingsOf(id).forEach(s => { const sp = P(s.id); if (sp && sp.birth.date) push(sp.birth.date, (s.kind === 'half' ? 'Half-s' : 'S') + 'ibling ' + fullName(sp) + ' born', ''); });
  famsOf(id).forEach(f => {
    const sp = otherPartner(f, id);
    const who = sp && P(sp) ? fullName(P(sp)) : 'partner';
    if (f.marriage.date || f.marriage.place) push(f.marriage.date, 'Married ' + who, f.marriage.place);
    if (f.divorce.date) push(f.divorce.date, (f.status === 'separated' ? 'Separated from ' : 'Divorced ') + who, '');
    f.children.forEach(c => { const k = P(c.id); if (k && k.birth.date) push(k.birth.date, (c.rel === 'birth' ? 'Child ' : c.rel + ' child ') + fullName(k) + ' born', k.birth.place); });
  });
  (p.events || []).forEach(e => { if (e.type || e.date) push(e.date, e.type || 'Event', e.place || e.desc); });
  parentsOf(id).forEach(par => { const q = P(par); if (q && q.death.date) push(q.death.date, (q.sex === 'F' ? 'Mother' : q.sex === 'M' ? 'Father' : 'Parent') + ' ' + fullName(q) + ' died', ''); });
  if (p.death.date || p.death.place || (!p.living && !p.death.date)) push(p.death.date, 'Died' + (p.death.cause ? ' — ' + p.death.cause : ''), p.death.place);
  out.sort((a, b) => (a.k == null ? 1 : b.k == null ? -1 : a.k - b.k));
  return out;
}

/* ─── consistency checks ──────────────────────────────────────────────── */
function runChecks() {
  const out = [];
  const add = (lvl, id, title, desc) => out.push({ lvl: lvl, id: id, title: title, desc: desc });
  allPeople().forEach(p => {
    const b = parseDate(p.birth.date), d = parseDate(p.death.date);
    if (!p.given && !p.surname) add('warn', p.id, 'Unnamed person', 'This record has no name yet.');
    if (b && d && dateKey(p.death.date) < dateKey(p.birth.date)) add('err', p.id, 'Death before birth', fullName(p) + ' — ' + fmtDate(p.birth.date) + ' → ' + fmtDate(p.death.date) + '.');
    if (b && b.y > THIS_YEAR) add('err', p.id, 'Birth in the future', fullName(p) + ' is recorded as born in ' + b.y + '.');
    const age = ageOf(p);
    if (age != null && age > 122) add('warn', p.id, 'Implausible age', fullName(p) + ' would be ' + age + ' years old.');
    if (!isDeceased(p) && b && THIS_YEAR - b.y > 110) add('warn', p.id, 'Very old and still living', fullName(p) + ' was born in ' + b.y + ' and is marked living.');
    if (p.death.date && p.living) add('info', p.id, 'Marked living with a death date', fullName(p) + ' has a death date but the Living box is ticked.');
    parentsOf(p.id).forEach(par => {
      const q = P(par); if (!q) return;
      const gap = yearsBetween(q.birth.date, p.birth.date);
      if (gap != null && gap < 12) add('err', p.id, 'Parent too young', fullName(q) + ' would have been ' + gap + ' at the birth of ' + fullName(p) + '.');
      if (gap != null && gap > 70) add('warn', p.id, 'Very large parent gap', fullName(q) + ' would have been ' + gap + ' at the birth of ' + fullName(p) + '.');
      const after = yearsBetween(q.death.date, p.birth.date);
      if (after != null && after > (q.sex === 'M' ? 1 : 0)) add('err', p.id, 'Born after a parent died', fullName(p) + ' was born ' + after + ' year(s) after ' + fullName(q) + ' died.');
    });
    if (parentsOf(p.id).some(par => isAncestorOf(p.id, par, new Set()))) add('err', p.id, 'Circular lineage', fullName(p) + ' appears as their own ancestor.');
    famsOf(p.id).forEach(f => {
      const m = yearsBetween(p.birth.date, f.marriage.date);
      if (m != null && m < 12 && f.marriage.date) add('warn', p.id, 'Married very young', fullName(p) + ' would have been ' + m + ' at marriage.');
      if (f.marriage.date && p.death.date && dateKey(f.marriage.date) > dateKey(p.death.date)) add('err', p.id, 'Married after death', fullName(p) + ' has a marriage dated after their death.');
    });
  });
  // duplicates
  const byName = {};
  allPeople().forEach(p => {
    const k = (fullName(p) + '|' + (yearOf(p.birth.date) || '')).toLowerCase();
    if (!p.given && !p.surname) return;
    (byName[k] = byName[k] || []).push(p);
  });
  Object.keys(byName).forEach(k => { if (byName[k].length > 1) add('info', byName[k][0].id, 'Possible duplicate', byName[k].length + ' people named ' + fullName(byName[k][0]) + ' with the same birth year.'); });
  // disconnected islands
  const comp = components();
  if (comp.length > 1) {
    comp.slice(1).forEach(c => add('info', c[0], 'Disconnected group', c.length + ' ' + (c.length === 1 ? 'person is' : 'people are') + ' not linked to the main tree (starting with ' + fullName(P(c[0])) + ').'));
  }
  const order = { err: 0, warn: 1, info: 2 };
  out.sort((a, b) => order[a.lvl] - order[b.lvl]);
  return out;
}
/** Connected components over the whole kinship graph, largest first. */
function components() {
  const seen = new Set(), out = [];
  allPeople().forEach(p => {
    if (seen.has(p.id)) return;
    const stack = [p.id], group = [];
    while (stack.length) {
      const cur = stack.pop();
      if (seen.has(cur)) continue;
      seen.add(cur); group.push(cur);
      parentsOf(cur).concat(childrenOf(cur), partnersOf(cur), siblingsOf(cur).map(s => s.id))
        .forEach(n => { if (!seen.has(n)) stack.push(n); });
    }
    out.push(group);
  });
  return out.sort((a, b) => b.length - a.length);
}
function renderChecks() {
  const issues = runChecks();

  let h = '<div class="f2" style="margin-bottom:8px">'
    + '<div class="stat"><div class="n">' + n + '</div><div class="l">People</div></div>'

    + '<div class="stat"><div class="n">' + gens + '</div><div class="l">Generations</div></div>'

    + '<div class="f2" style="margin-bottom:14px">'
    + '<div class="stat"><div class="n">' + living + '</div><div class="l">Living</div></div>'

  h += '<div class="grp"><div class="grp-h">Sex</div>' + bar([['Male', male], ['Female', female], ['Other / unknown', n - male - female]], Math.max(1, n)) + '</div>';

  if (dks.length) h += '<div class="grp"><div class="grp-h">Births by decade</div>' + bar(dks.map(d => [d + 's', decades[d]]), Math.max.apply(null, dks.map(d => decades[d]))) + '</div>';
  if (topPlaces.length) h += '<div class="grp"><div class="grp-h">Birth places</div>' + bar(topPlaces, topPlaces[0][1]) + '</div>';
  if (oldest) h += '<div class="grp"><div class="grp-h">Longest life</div><div class="hint">' + esc(fullName(oldest.p)) + ' — ' + oldest.a + ' years (' + esc(lifespan(oldest.p)) + ')</div></div>';

}
function maxGenerations() {
  const roots = allPeople().filter(p => !parentsOf(p.id).length).map(p => p.id);
  let best = 0;
  const depth = (id, seen) => {
    if (seen.has(id)) return 0;
    seen.add(id);
    const kids = childrenOf(id);
    let m = 0;
    kids.forEach(k => { m = Math.max(m, depth(k, seen)); });
    seen.delete(id);
    return 1 + m;
  };
  roots.forEach(r => { best = Math.max(best, depth(r, new Set())); });
  return best || (allPeople().length ? 1 : 0);
}

/* ─── GEDCOM 5.5.1 ────────────────────────────────────────────────────────
   Export writes the subset of tags this app models; import reads the same
   subset plus the common variants other programs emit.
   ──────────────────────────────────────────────────────────────────────── */
function gedDate(raw) {
  const p = parseDate(raw); if (!p) return raw ? String(raw).toUpperCase() : '';
  let core = String(p.y);
  if (p.m) core = (p.d ? p.d + ' ' : '') + MON[p.m - 1].toUpperCase() + ' ' + p.y;
  const pre = { about: 'ABT ', before: 'BEF ', after: 'AFT ', estimated: 'EST ', calculated: 'CAL ' }[p.qual] || '';
  return pre + core;
}
function gedEscape(s) { return String(s == null ? '' : s).replace(/\r/g, ''); }
function gedLines(level, tag, value, out) {
  if (value == null || value === '') return;
  const parts = gedEscape(value).split('\n');
  parts.forEach((line, i) => {
    if (i === 0) out.push(level + ' ' + tag + ' ' + line);
    else out.push((level + 1) + ' CONT ' + line);
  });
}
function toGEDCOM() {
  const out = [];
  const iref = {}, fref = {};
  let i = 0, f = 0;
  Object.keys(T.people).forEach(id => { iref[id] = '@I' + (++i) + '@'; });
  Object.keys(T.families).forEach(id => { fref[id] = '@F' + (++f) + '@'; });
  const now = new Date();
  out.push('0 HEAD');
  out.push('1 SOUR KINFOLK');
  out.push('2 NAME Kinfolk Family Tree');
  out.push('2 VERS 1.0');
  out.push('1 DEST ANY');
  out.push('1 DATE ' + now.getDate() + ' ' + MON[now.getMonth()].toUpperCase() + ' ' + now.getFullYear());
  out.push('1 FILE ' + (T.name || 'family').replace(/[^\w\- ]/g, '') + '.ged');
  out.push('1 GEDC'); out.push('2 VERS 5.5.1'); out.push('2 FORM LINEAGE-LINKED');
  out.push('1 CHAR UTF-8');
  out.push('1 SUBM @SUB1@');
  out.push('0 @SUB1@ SUBM');
  out.push('1 NAME ' + (T.name || 'Kinfolk user'));

  Object.keys(T.people).forEach(id => {
    const p = T.people[id];
    out.push('0 ' + iref[id] + ' INDI');
    out.push('1 NAME ' + gedEscape(p.given) + ' /' + gedEscape(p.surname) + '/' + (p.suffix ? ' ' + gedEscape(p.suffix) : ''));
    gedLines(2, 'GIVN', p.given, out);
    gedLines(2, 'SURN', p.surname, out);
    gedLines(2, 'NSFX', p.suffix, out);
    gedLines(2, 'NICK', p.nickname, out);
    if (p.birthSurname && p.birthSurname !== p.surname) {
      out.push('1 NAME ' + gedEscape(p.given) + ' /' + gedEscape(p.birthSurname) + '/');
      out.push('2 TYPE birth');
    }
    out.push('1 SEX ' + (p.sex === 'M' || p.sex === 'F' ? p.sex : 'U'));
    if (p.birth.date || p.birth.place) {
      out.push('1 BIRT');
      gedLines(2, 'DATE', gedDate(p.birth.date), out);
      gedLines(2, 'PLAC', p.birth.place, out);
    }
    if (isDeceased(p)) {
      out.push('1 DEAT');
      gedLines(2, 'DATE', gedDate(p.death.date), out);
      gedLines(2, 'PLAC', p.death.place, out);
      gedLines(2, 'CAUS', p.death.cause, out);
    }
    gedLines(1, 'OCCU', p.occupation, out);
    gedLines(1, 'RELI', p.religion, out);
    (p.events || []).forEach(ev => {
      if (!ev.type && !ev.date && !ev.place) return;
      out.push('1 EVEN');
      gedLines(2, 'TYPE', ev.type, out);
      gedLines(2, 'DATE', gedDate(ev.date), out);
      gedLines(2, 'PLAC', ev.place, out);
      gedLines(2, 'NOTE', ev.desc, out);
    });
    (p.tags || []).forEach(t => gedLines(1, 'NOTE', 'Tag: ' + t, out));
    gedLines(1, 'NOTE', p.notes, out);
    famcOf(id).forEach(fam => {
      out.push('1 FAMC ' + fref[fam.id]);
      const r = relOfChild(fam, id);
      if (r && r !== 'birth') out.push('2 PEDI ' + (r === 'step' ? 'step' : r === 'foster' ? 'foster' : r === 'adopted' ? 'adopted' : 'sealing'));
    });
    famsOf(id).forEach(fam => out.push('1 FAMS ' + fref[fam.id]));
  });

  Object.keys(T.families).forEach(id => {
    const fam = T.families[id];
    out.push('0 ' + fref[id] + ' FAM');
    const a = fam.partners[0] ? T.people[fam.partners[0]] : null;
    const b = fam.partners[1] ? T.people[fam.partners[1]] : null;
    // GEDCOM wants HUSB/WIFE; fall back to declaration order when sex is unknown.
    let husb = null, wife = null;
    if (a && a.sex === 'F') wife = a; else if (a) husb = a;
    if (b && b.sex === 'F' && !wife) wife = b; else if (b && !husb) husb = b; else if (b && !wife) wife = b;
    if (husb) out.push('1 HUSB ' + iref[husb.id]);
    if (wife) out.push('1 WIFE ' + iref[wife.id]);
    fam.children.forEach(c => { if (iref[c.id]) out.push('1 CHIL ' + iref[c.id]); });
    if (fam.marriage.date || fam.marriage.place || fam.status === 'married') {
      out.push('1 MARR');
      gedLines(2, 'DATE', gedDate(fam.marriage.date), out);
      gedLines(2, 'PLAC', fam.marriage.place, out);
    }
    if (fam.status === 'divorced') { out.push('1 DIV'); gedLines(2, 'DATE', gedDate(fam.divorce.date), out); }
    if (fam.status === 'separated' && fam.divorce.date) { out.push('1 EVEN'); out.push('2 TYPE Separation'); gedLines(2, 'DATE', gedDate(fam.divorce.date), out); }
    gedLines(1, 'NOTE', fam.notes, out);
  });
  out.push('0 TRLR');
  return out.join('\n') + '\n';
}

function parseGEDCOM(text) {
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const records = [];
  let cur = null;
  const stack = [];
  lines.forEach(raw => {
    const line = raw.replace(/^﻿/, '').trimRight();
    if (!line.trim()) return;
    const m = line.match(/^\s*(\d+)\s+(?:(@[^@]*@)\s+)?([A-Za-z0-9_]+)(?:\s(.*))?$/);
    if (!m) return;
    const level = +m[1], xref = m[2] || null, tag = m[3].toUpperCase(), val = m[4] == null ? '' : m[4];
    const node = { tag: tag, xref: xref, val: val, kids: [] };
    if (level === 0) { cur = node; records.push(node); stack.length = 0; stack[0] = node; return; }
    if (tag === 'CONT' || tag === 'CONC') {
      const parent = stack[level - 1];
      if (parent) parent.val += (tag === 'CONT' ? '\n' : '') + val;
      return;
    }
    const parent = stack[level - 1];
    if (parent) parent.kids.push(node);
    stack[level] = node;
    stack.length = level + 1;
  });
  const kid = (n, tag) => n.kids.filter(k => k.tag === tag)[0];
  const kids = (n, tag) => n.kids.filter(k => k.tag === tag);
  const sub = (n, tag) => { const k = kid(n, tag); return k ? k.val.trim() : ''; };

  const tree = blankTree('Imported tree');
  const map = {}, fmap = {};
  records.filter(r => r.tag === 'INDI').forEach(r => {
    const p = blankPerson();
    const nameNode = kid(r, 'NAME');
    if (nameNode) {
      const nm = nameNode.val || '';
      const mm = nm.match(/^(.*?)\/([^/]*)\/(.*)$/);
      if (mm) { p.given = mm[1].trim(); p.surname = mm[2].trim(); p.suffix = mm[3].trim(); }
      else p.given = nm.trim();
      p.given = sub(nameNode, 'GIVN') || p.given;
      p.surname = sub(nameNode, 'SURN') || p.surname;
      p.suffix = sub(nameNode, 'NSFX') || p.suffix;
      p.nickname = sub(nameNode, 'NICK') || p.nickname;
    }
    kids(r, 'NAME').slice(1).forEach(nn => {
      if ((sub(nn, 'TYPE') || '').toLowerCase() === 'birth') {
        const mm = (nn.val || '').match(/\/([^/]*)\//);
        if (mm) p.birthSurname = mm[1].trim();
      }
    });
    const sx = (sub(r, 'SEX') || 'U').toUpperCase();
    p.sex = sx === 'M' || sx === 'F' ? sx : (sx === 'X' ? 'X' : 'U');
    const b = kid(r, 'BIRT') || kid(r, 'CHR');
    if (b) { p.birth.date = sub(b, 'DATE'); p.birth.place = sub(b, 'PLAC'); }
    const d = kid(r, 'DEAT');
    if (d) { p.living = false; p.death.date = sub(d, 'DATE'); p.death.place = sub(d, 'PLAC'); p.death.cause = sub(d, 'CAUS'); }
    const bur = kid(r, 'BURI');
    if (bur) { p.living = false; p.events.push({ type: 'Burial', date: sub(bur, 'DATE'), place: sub(bur, 'PLAC'), desc: '' }); }
    p.occupation = sub(r, 'OCCU');
    p.religion = sub(r, 'RELI');
    const notes = kids(r, 'NOTE').map(nn => nn.val).filter(Boolean);
    notes.forEach(nv => { const t = nv.match(/^Tag:\s*(.+)$/); if (t) p.tags.push(t[1].trim()); });
    p.notes = notes.filter(nv => !/^Tag:\s/.test(nv)).join('\n\n');
    kids(r, 'EVEN').forEach(ev => p.events.push({ type: sub(ev, 'TYPE') || 'Event', date: sub(ev, 'DATE'), place: sub(ev, 'PLAC'), desc: sub(ev, 'NOTE') }));
    ['BAPM', 'CHRA', 'CONF', 'GRAD', 'IMMI', 'EMIG', 'NATU', 'RESI', 'CENS', 'RETI', 'PROB'].forEach(tag => {
      kids(r, tag).forEach(ev => p.events.push({ type: { BAPM: 'Baptism', CHRA: 'Christening', CONF: 'Confirmation', GRAD: 'Graduation', IMMI: 'Immigration', EMIG: 'Emigration', NATU: 'Naturalisation', RESI: 'Residence', CENS: 'Census', RETI: 'Retirement', PROB: 'Probate' }[tag], date: sub(ev, 'DATE'), place: sub(ev, 'PLAC'), desc: '' }));
    });
    if (p.death.date || p.death.place) p.living = false;
    tree.people[p.id] = p;
    if (r.xref) map[r.xref] = p.id;
  });
  records.filter(r => r.tag === 'FAM').forEach(r => {
    const f = blankFamily();
    const h = sub(r, 'HUSB'), w = sub(r, 'WIFE');
    f.partners = [map[h] || null, map[w] || null];
    const marr = kid(r, 'MARR');
    if (marr) { f.status = 'married'; f.marriage.date = sub(marr, 'DATE'); f.marriage.place = sub(marr, 'PLAC'); }
    else f.status = 'unknown';
    const div = kid(r, 'DIV');
    if (div) { f.status = 'divorced'; f.divorce.date = sub(div, 'DATE'); }
    f.notes = kids(r, 'NOTE').map(n => n.val).join('\n\n');
    kids(r, 'CHIL').forEach(c => { const cid = map[c.val.trim()]; if (cid) f.children.push({ id: cid, rel: 'birth' }); });
    if (f.partners.filter(Boolean).length || f.children.length) { tree.families[f.id] = f; if (r.xref) fmap[r.xref] = f.id; }
  });
  // PEDI lives under the individual's FAMC pointer
  records.filter(r => r.tag === 'INDI').forEach(r => {
    const pid = map[r.xref]; if (!pid) return;
    kids(r, 'FAMC').forEach(fc => {
      const fid = fmap[(fc.val || '').trim()]; if (!fid) return;
      const pedi = (sub(fc, 'PEDI') || '').toLowerCase();
      const fam = tree.families[fid]; if (!fam) return;
      if (!fam.children.some(c => c.id === pid)) fam.children.push({ id: pid, rel: 'birth' });
      if (pedi && pedi !== 'birth') {
        const c = fam.children.filter(c => c.id === pid)[0];
        if (c) c.rel = pedi === 'adopted' ? 'adopted' : pedi === 'foster' ? 'foster' : pedi === 'step' ? 'step' : 'birth';
      }
    });
  });
  const head = records.filter(r => r.tag === 'HEAD')[0];
  if (head) { const fileName = sub(head, 'FILE'); if (fileName) tree.name = fileName.replace(/\.ged(com)?$/i, ''); }
  tree.focus = Object.keys(tree.people)[0] || null;
  return tree;
}

/* ─── files ───────────────────────────────────────────────────────────── */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
const safeName = () => (T.name || 'family-tree').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'family-tree';

function exportJSON() { download(safeName() + '.json', JSON.stringify(T, null, 2), 'application/json'); toast('Tree exported as JSON'); }
function exportGED()  { download(safeName() + '.ged', toGEDCOM(), 'text/plain'); toast('Tree exported as GEDCOM'); }
function exportCSV() {
  const head = ['id', 'given', 'surname', 'birth_surname', 'sex', 'birth_date', 'birth_place', 'death_date', 'death_place', 'living', 'occupation', 'father', 'mother', 'partners', 'children', 'notes'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""').replace(/\n/g, ' ') + '"';
  const rows = [head.join(',')];
  allPeople().forEach(p => {
    const par = orderedParents(p.id).map(P).filter(Boolean);
    const father = par.filter(x => x.sex === 'M')[0], mother = par.filter(x => x.sex === 'F')[0];
    rows.push([p.id, p.given, p.surname, p.birthSurname, p.sex, p.birth.date, p.birth.place, p.death.date, p.death.place,
      isDeceased(p) ? 'no' : 'yes', p.occupation,
      father ? fullName(father) : '', mother ? fullName(mother) : '',
      partnersOf(p.id).map(id => fullName(P(id))).join('; '),
      childrenOf(p.id).map(id => fullName(P(id))).join('; '), p.notes].map(q).join(','));
  });
  download(safeName() + '-people.csv', rows.join('\n'), 'text/csv');
  toast('People exported as CSV');
}
/** Snapshot the current chart as a standalone SVG with computed colours baked in. */
function chartSVGText() {
  if (!CHART) return null;
  const src = $('#chart');
  const cs = getComputedStyle(document.documentElement);
  const vars = ['--panel', '--line', '--ink', '--ink-2', '--ink-3', '--accent', '--bronze', '--male', '--female', '--neutral', '--bg'];
  let cssVars = vars.map(v => v + ':' + cs.getPropertyValue(v).trim() + ';').join('');
  const style = Array.prototype.slice.call(document.styleSheets)
    .map(s => { try { return Array.prototype.slice.call(s.cssRules).map(r => r.cssText).join('\n'); } catch (e) { return ''; } }).join('\n')
    .split('\n').filter(l => /\.node|\.lnk|\.udot|\.uyr|\.ghost|\.gen-/.test(l)).join('\n');
  const copy = src.cloneNode(true);
  copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  copy.setAttribute('width', Math.round(CHART.width));
  copy.setAttribute('height', Math.round(CHART.height));
  copy.setAttribute('viewBox', '0 0 ' + Math.round(CHART.width) + ' ' + Math.round(CHART.height));
  copy.querySelector('#viewport').setAttribute('transform', '');
  const st = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  st.textContent = ':root{' + cssVars + '}svg{background:' + cs.getPropertyValue('--bg').trim() + ';font-family:Inter,sans-serif}' + style;
  copy.insertBefore(st, copy.firstChild);
  return new XMLSerializer().serializeToString(copy);
}
function exportSVG() {
  const t = chartSVGText();
  if (!t) return toast('Nothing to export yet');
  download(safeName() + '-chart.svg', t, 'image/svg+xml');
  toast('Chart exported as SVG');
}
function exportPNG(scale) {
  const t = chartSVGText();
  if (!t) return toast('Nothing to export yet');
  const img = new Image();
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t);
  img.onload = function () {
    const s = scale || 2;
    const c = document.createElement('canvas');
    c.width = Math.min(12000, Math.round(CHART.width * s));
    c.height = Math.min(12000, Math.round(CHART.height * s));
    const ctx = c.getContext('2d');
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(function (blob) {
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u; a.download = safeName() + '-chart.png';
      document.body.appendChild(a); a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(u); }, 400);
      toast('Chart exported as PNG');
    }, 'image/png');
  };
  img.onerror = function () { toast('Could not render the chart image — try SVG export instead.'); };
  img.src = url;
}
/** Downscale a chosen photo so trees stay small enough for local storage. */
function readPhoto(file, cb) {
  const fr = new FileReader();
  fr.onload = function () {
    const img = new Image();
    img.onload = function () {
      const max = 320;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { toast('That image could not be read'); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/** Choose an existing person or create one on the spot. */
function pickPerson(o) {
  const exclude = o.exclude || [];
  const body =
    '<div class="grp"><div class="grp-h">Create someone new</div>'
    + '<div class="f2"><div class="fw"><label class="fl">First names</label><input class="field" id="pp-given" placeholder="Given name"></div>'
    + '<div class="fw"><label class="fl">Last name</label><input class="field" id="pp-surname" value="' + esc(o.surname || '') + '" placeholder="Family name"></div></div>'
    + '<div class="f2"><div class="fw"><label class="fl">Sex</label><select class="field" id="pp-sex">'
    + SEXES.map(s => '<option value="' + s[0] + '"' + (s[0] === (o.sex || 'U') ? ' selected' : '') + '>' + s[1] + '</option>').join('') + '</select></div>'
    + '<div class="fw"><label class="fl">Born</label><input class="field" id="pp-birth" placeholder="e.g. 1952"></div></div>'
    + '<button class="btn pri wide" id="pp-create"><svg><use href="#i-user-plus"/></svg>Create and link</button></div>'
    + '<div class="grp"><div class="grp-h">…or link someone already in the tree</div>'
    + '<div class="searchwrap"><svg><use href="#i-search"/></svg><input class="field with-icon" id="pp-q" placeholder="Search people…"></div>'
    + '<div class="picker-list" id="pp-list"></div></div>';
  openModal({
    title: o.title, sub: o.sub, body: body,
    foot: '<button class="btn" data-close="1">Cancel</button>',
    after: function () {
      const draw = () => {
        const q = ($('#pp-q').value || '').trim().toLowerCase();
        let list = sortPeople(allPeople().filter(p => exclude.indexOf(p.id) < 0), 'name');
        if (q) list = list.filter(p => fullName(p).toLowerCase().indexOf(q) >= 0);
        $('#pp-list').innerHTML = list.length
          ? list.slice(0, 300).map(p => '<button class="pitem" data-pick="' + esc(p.id) + '">' + avatarHTML(p)
            + '<span class="pitem-txt"><span class="pitem-name">' + esc(fullName(p)) + '</span><span class="pitem-sub">'
            + esc(lifespan(p) || 'no dates') + '</span></span></button>').join('')
          : '<div class="empty">No one else to link.</div>';
      };
      draw();
      $('#pp-q').addEventListener('input', draw);
      $('#pp-list').addEventListener('click', e => {
        const b = e.target.closest('[data-pick]'); if (!b) return;
        const id = b.dataset.pick; closeModal(); o.onPick(id, false);
      });
      const create = () => {
        const given = $('#pp-given').value.trim(), surname = $('#pp-surname').value.trim();
        const sex = $('#pp-sex').value, birth = $('#pp-birth').value.trim();
        if (!given && !surname) { $('#pp-given').focus(); return toast('Give the new person a name first'); }
        closeModal();
        o.onPick({ given: given, surname: surname, sex: sex, birth: { date: birth, place: '' } }, true);
      };
      $('#pp-create').addEventListener('click', create);
      ['pp-given', 'pp-surname', 'pp-birth'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') create(); }));
      setTimeout(() => $('#pp-given').focus(), 30);
    }
  });
}
/** Resolve a pickPerson result (existing id or new-person patch) to an id. */
function resolvePick(res) { return typeof res === 'string' ? res : addPerson(res).id; }

/* ─── relationship-adding actions ─────────────────────────────────────── */
function actAddParent(childId, famId) {
  const p = P(childId); if (!p) return;
  const known = parentsOf(childId);
  pickPerson({
    title: 'Add a parent', sub: 'for ' + fullName(p), exclude: known.concat([childId]),
    surname: p.surname, sex: known.length && P(known[0]) && P(known[0]).sex === 'M' ? 'F' : 'M',
    onPick: res => mutate(() => {
      const id = resolvePick(res);
      if (isAncestorOf(childId, id)) return toast('That would create a loop in the lineage');
      const f = famId ? F(famId) : null, slot = f ? f.partners.indexOf(null) : -1;
      if (f && slot >= 0) f.partners[slot] = id; else addParentTo(childId, id);
      sel = id;
    }, 'Parent added')
  });
}
function actAddPartner(pid, famId) {
  const p = P(pid); if (!p) return;
  pickPerson({
    title: 'Add a partner', sub: 'for ' + fullName(p), exclude: partnersOf(pid).concat([pid]),
    sex: p.sex === 'M' ? 'F' : p.sex === 'F' ? 'M' : 'U',
    onPick: res => mutate(() => {
      const id = resolvePick(res);
      const f = famId ? F(famId) : null, slot = f ? f.partners.indexOf(null) : -1;
      if (f && slot >= 0) f.partners[slot] = id; else linkPartners(pid, id, 'married');
      sel = id;
    }, 'Partner added')
  });
}
function actAddChild(pid, famId) {
  const p = P(pid); if (!p) return;
  pickPerson({
    title: 'Add a child', sub: famId && F(famId) && otherPartner(F(famId), pid) ? 'to ' + fullName(p) + ' and ' + fullName(P(otherPartner(F(famId), pid))) : 'for ' + fullName(p),
    exclude: childrenOf(pid).concat([pid]), surname: p.sex === 'F' ? (partnersOf(pid).map(x => P(x)).filter(Boolean)[0] || {}).surname || p.surname : p.surname,
    onPick: res => mutate(() => {
      const id = resolvePick(res);
      if (isAncestorOf(id, pid)) return toast('That would create a loop in the lineage');
      if (famId && F(famId)) linkChild(famId, id, 'birth'); else addChildTo(pid, id, 'birth');
      sel = id;
    }, 'Child added')
  });
}
function actAddSibling(pid) {
  const p = P(pid); if (!p) return;
  pickPerson({
    title: 'Add a sibling', sub: 'for ' + fullName(p), exclude: siblingsOf(pid).map(s => s.id).concat([pid]), surname: p.surname,
    onPick: res => mutate(() => {
      const id = resolvePick(res);
      const fams = famcOf(pid);
      if (fams.length) linkChild(fams[0].id, id, 'birth');
      else {
        const f = blankFamily({ partners: [null, null], status: 'unknown', children: [{ id: pid, rel: 'birth' }, { id: id, rel: 'birth' }] });
        T.families[f.id] = f;
      }
      sel = id;
    }, 'Sibling added')
  });
}

function dlgTrees() {
  const list = treeIndex();
  const body = '<div class="picker-list" style="max-height:300px">' + (list.length ? list.map(t =>
    '<div class="relrow"><span class="avatar" style="background:var(--accent)"><svg style="width:15px;height:15px"><use href="#i-tree"/></svg></span>'
    + '<div class="pitem-txt" data-opentree="' + esc(t.id) + '" style="cursor:pointer"><div class="pitem-name">' + esc(t.name) + (t.id === T.id ? ' · open' : '') + '</div>'
    + '<div class="pitem-sub">' + (t.count || 0) + ' people · ' + new Date(t.modified).toLocaleDateString() + '</div></div>'
    + '<button class="x" data-duptree="' + esc(t.id) + '" title="Duplicate"><svg><use href="#i-copy"/></svg></button>'
    + '<button class="x" data-deltree="' + esc(t.id) + '" title="Delete"><svg><use href="#i-trash"/></svg></button></div>').join('')
    : '<div class="empty"><strong>No saved trees</strong>The tree you are working on saves automatically.</div>') + '</div>';
  openModal({
    title: 'Your trees', sub: 'Stored privately in this browser. Export to a file to keep a backup.',
    body: body, noFocus: true,
    foot: '<button class="btn" data-close="1">Close</button><button class="btn pri" id="new-tree"><svg><use href="#i-plus"/></svg>New tree</button>',
    after: function () {
      $('#new-tree').addEventListener('click', () => {
        closeModal();
        persistNow();
        T = blankTree('New family tree'); sel = null;
        undoStack.length = redoStack.length = 0;
        reindex(); persist(); renderAll(); fitView();
        toast('New tree created');
      });
      $('#m-body').addEventListener('click', e => {
        const open = e.target.closest('[data-opentree]'), dup = e.target.closest('[data-duptree]'), del = e.target.closest('[data-deltree]');
        if (open) { closeModal(); loadTree(open.dataset.opentree); }
        else if (dup) {
          const raw = localStorage.getItem(LS_TREE + dup.dataset.duptree);
          if (!raw) return toast('Could not read that tree');
          const t = JSON.parse(raw); t.id = uid('t_'); t.name = t.name + ' (copy)'; t.modified = Date.now();
          try { localStorage.setItem(LS_TREE + t.id, JSON.stringify(t)); } catch (err) { return toast('Storage is full'); }
          const list2 = treeIndex(); list2.unshift({ id: t.id, name: t.name, modified: t.modified, count: Object.keys(t.people).length });
          writeIndex(list2); closeModal(); dlgTrees(); toast('Tree duplicated');
        } else if (del) {
          const id = del.dataset.deltree;
          if (!confirm('Delete this tree permanently? This cannot be undone.')) return;
          localStorage.removeItem(LS_TREE + id);
          writeIndex(treeIndex().filter(t => t.id !== id));
          if (id === T.id) { T = blankTree(); sel = null; reindex(); renderAll(); }
          closeModal(); dlgTrees(); toast('Tree deleted');
        }
      });
    }
  });

function loadTree(id) {
  persistNow();
  const raw = localStorage.getItem(LS_TREE + id);
  if (!raw) return toast('That tree could not be found');
  try {
    T = normaliseTree(JSON.parse(raw));
    sel = null; undoStack.length = redoStack.length = 0;
    reindex(); renderAll(); fitView(); toast('Opened “' + T.name + '”');
  } catch (e) { toast('That tree file is damaged'); }
}
/** Fill in anything a older/foreign file may be missing. */
function normaliseTree(t) {
  const out = blankTree(t.name);
  out.id = t.id || out.id; out.created = t.created || Date.now(); out.modified = t.modified || Date.now();
  Object.keys(t.people || {}).forEach(id => { out.people[id] = Object.assign(blankPerson({ id: id }), t.people[id]); const p = out.people[id]; p.birth = Object.assign({ date: '', place: '' }, p.birth); p.death = Object.assign({ date: '', place: '', cause: '' }, p.death); p.events = p.events || []; p.tags = p.tags || []; });
  Object.keys(t.families || {}).forEach(id => {
    const f = Object.assign(blankFamily({ id: id }), t.families[id]);
    f.marriage = Object.assign({ date: '', place: '' }, f.marriage);
    f.divorce = Object.assign({ date: '' }, f.divorce);
    f.partners = (f.partners || [null, null]).slice(0, 2);
    while (f.partners.length < 2) f.partners.push(null);
    f.children = (f.children || []).map(c => typeof c === 'string' ? { id: c, rel: 'birth' } : c);
    out.families[id] = f;
  });
  out.focus = t.focus && out.people[t.focus] ? t.focus : Object.keys(out.people)[0] || null;
  return out;
}
