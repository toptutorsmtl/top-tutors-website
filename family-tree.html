  });
  $('#pane-checks').addEventListener('click', e => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    select(b.dataset.id, true);
  });

  // chart toolbar
  $$('#mode-seg button').forEach(b => b.addEventListener('click', () => {
    prefs.mode = b.dataset.mode; savePrefs();
    $$('#mode-seg button').forEach(x => x.classList.toggle('on', x === b));
    renderChart(false);
  }));
  const bindRange = (id, key, out) => {
    const r = $(id);
    r.value = prefs[key];
    $(out).textContent = prefs[key];
    r.addEventListener('input', () => { prefs[key] = +r.value; $(out).textContent = r.value; savePrefs(); renderChart(true); });
  };
  bindRange('#depth-up', 'up', '#depth-up-v');
  bindRange('#depth-dn', 'down', '#depth-dn-v');
  $('#opt-sibs').addEventListener('change', e => { prefs.sibs = e.target.checked; savePrefs(); renderChart(true); });
  $('#opt-ghosts').addEventListener('change', e => { prefs.ghosts = e.target.checked; savePrefs(); renderChart(true); });
  $('#z-in').addEventListener('click', () => zoomBy(1.25));
  $('#z-out').addEventListener('click', () => zoomBy(0.8));
  $('#z-fit').addEventListener('click', fitView);
  $('#z-home').addEventListener('click', () => centreOn(T.focus, 1));

  // chart interaction
  const svg = $('#chart');
  const pointers = new Map();
  let drag = null, pinch = null, moved = false;
  svg.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      pinch = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), k: view.k };
      drag = null; return;
    }
    drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    moved = false;
    svg.setPointerCapture(e.pointerId);
    svg.classList.add('dragging');
  });
  svg.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const r = svg.getBoundingClientRect();
      const cx = (pts[0].x + pts[1].x) / 2 - r.left, cy = (pts[0].y + pts[1].y) / 2 - r.top;
      const target = clamp(pinch.k * (d / pinch.d), 0.08, 3);
      zoomBy(target / view.k, cx, cy);
      moved = true; return;
    }
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    view.x = drag.vx + dx; view.y = drag.vy + dy;
    applyView();
  });
  const endPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    drag = null; svg.classList.remove('dragging');
  };
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomBy(e.deltaY < 0 ? 1.12 : 0.89, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  svg.addEventListener('click', e => {
    if (moved) { moved = false; return; }
    const ghost = e.target.closest('[data-ghost]');
    if (ghost) return actAddParent(ghost.dataset.ghost, null);
    const n = e.target.closest('.node[data-id]');
    if (n) select(n.dataset.id, false);
  });
  svg.addEventListener('dblclick', e => {
    const n = e.target.closest('.node[data-id]');
    if (n) setFocus(n.dataset.id);
  });
  svg.addEventListener('contextmenu', e => {
    const n = e.target.closest('.node[data-id]');
    if (!n) return;
    e.preventDefault();
    select(n.dataset.id, false);
    showCtx(e.clientX, e.clientY, n.dataset.id);
  });
  // long-press for touch
  let lp = null;
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    const n = e.target.closest('.node[data-id]');
    if (!n) return;
    lp = setTimeout(() => { select(n.dataset.id, false); showCtx(e.clientX, e.clientY, n.dataset.id); }, 520);
  });
  ['pointerup', 'pointermove', 'pointercancel'].forEach(ev => svg.addEventListener(ev, () => { clearTimeout(lp); }));

  $('#ctx').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const id = $('#ctx').dataset.id;
    hideCtx();
    const act = b.dataset.act;
    if (act === 'open') select(id, true);
    else if (act === 'focus') setFocus(id);
    else if (act === 'parent') actAddParent(id, null);
    else if (act === 'partner') actAddPartner(id, null);
    else if (act === 'child') actAddChild(id, null);
    else if (act === 'sibling') actAddSibling(id);
    else if (act === 'rel') { sel = id; dlgRelationship(); }
    else if (act === 'delete') confirmDelete(id);
  });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#ctx')) hideCtx(); }, true);
  window.addEventListener('resize', debounce(() => { if (CHART) applyView(); }, 150));

  // detail panel
  $('#d-close').addEventListener('click', () => { sel = null; renderDetail(); renderList(); renderChart(true); });
  $('#d-focus').addEventListener('click', () => { if (sel) setFocus(sel); });
  $('#d-delete').addEventListener('click', () => { if (sel) confirmDelete(sel); });
  $$('.dtab').forEach(b => b.addEventListener('click', () => { dTab = b.dataset.dtab; renderDetail(); }));
  $('#photo-btn').addEventListener('click', () => { if (sel) $('#photo-in').click(); });

  const detail = $('#detail');
  detail.addEventListener('change', e => {
    const t = e.target, p = P(sel); if (!p) return;
    if (t.dataset.path) {
      const v = t.type === 'checkbox' ? t.checked : t.value;
      mutate(() => setPath(p, t.dataset.path, v));
    } else if (t.dataset.fam) {
      const f = F(t.dataset.fam); if (!f) return;
      mutate(() => setPath(f, t.dataset.fampath, t.value));
    } else if (t.dataset.childrel) {
      const f = F(t.dataset.childrel); if (!f) return;
      mutate(() => { const c = f.children.filter(c => c.id === sel)[0]; if (c) c.rel = t.value; });
    } else if (t.dataset.ev != null && t.dataset.evpath) {
      mutate(() => { const ev = p.events[+t.dataset.ev]; if (ev) ev[t.dataset.evpath] = t.value; });
    }
  });
  detail.addEventListener('keydown', e => {
    if (e.target.id === 'tag-in' && e.key === 'Enter') {
      e.preventDefault();
      const v = e.target.value.trim(); if (!v) return;
      mutate(() => { const p = P(sel); p.tags = uniq((p.tags || []).concat([v])); });
    }
  });
  detail.addEventListener('click', e => {
    const p = P(sel); if (!p) return;
    const go = e.target.closest('[data-goto]');
    if (go) return select(go.dataset.goto, true);
    const untag = e.target.closest('[data-untag]');
    if (untag) return mutate(() => { p.tags = (p.tags || []).filter(t => t !== untag.dataset.untag); });
    if (e.target.closest('[data-addparent]')) return actAddParent(p.id, null);
    const ap2 = e.target.closest('[data-addparent2]');
    if (ap2) return actAddParent(p.id, ap2.dataset.addparent2);
    if (e.target.closest('[data-addpartner]')) return actAddPartner(p.id, null);
    const app2 = e.target.closest('[data-addpartner2]');
    if (app2) return actAddPartner(p.id, app2.dataset.addpartner2);
    const ac = e.target.closest('[data-addchild]');
    if (ac) return actAddChild(p.id, ac.dataset.addchild === 'new' ? null : ac.dataset.addchild);
    const unpa = e.target.closest('[data-unparent]');
    if (unpa) { const bits = unpa.dataset.unparent.split('|'); return mutate(() => unlinkPartner(bits[0], bits[1]), 'Unlinked'); }
    const unp = e.target.closest('[data-unpartner]');
    if (unp) { const f = F(unp.dataset.unpartner); const other = f ? otherPartner(f, p.id) : null; return mutate(() => { if (other) unlinkPartner(f.id, other); }, 'Unlinked'); }
    const unk = e.target.closest('[data-unkid]');
    if (unk) { const parts = unk.dataset.unkid.split('|'); return mutate(() => unlinkChild(parts[0], parts[1]), 'Unlinked'); }
    if (e.target.closest('[data-addev]')) return mutate(() => p.events.push({ type: '', date: '', place: '', desc: '' }));
    const de = e.target.closest('[data-delev]');
    if (de) return mutate(() => p.events.splice(+de.dataset.delev, 1));
    if (e.target.closest('#np-photo')) return $('#photo-in').click();
    if (e.target.closest('#np-photo-x')) return mutate(() => { p.photo = null; }, 'Photo removed');
  });

  // files
  $('#photo-in').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f || !sel) return;
    readPhoto(f, data => mutate(() => { const p = P(sel); if (p) p.photo = data; }, 'Photo added'));
  });
  $('#file-in').addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const text = String(fr.result);
      try {
        let t;
        if (/^\s*\{/.test(text)) t = normaliseTree(JSON.parse(text));
        else t = normaliseTree(parseGEDCOM(text));
        if (!Object.keys(t.people).length) return toast('No people found in that file');
        if (!t.name || t.name === 'Imported tree') t.name = f.name.replace(/\.(ged|gedcom|json)$/i, '');
        persistNow();
        T = t; sel = null; undoStack.length = redoStack.length = 0;
        reindex(); persist(); renderAll(); fitView();
        toast('Imported ' + Object.keys(T.people).length + ' people from ' + f.name);
      } catch (err) { toast('Could not read that file — is it a valid GEDCOM or JSON?'); }
    };
    fr.readAsText(f);
  });

  // modal
  $('#m-x').addEventListener('click', closeModal);
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeModal(); });
  $('#m-foot').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

  // keyboard
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (e.key === 'Escape') {
      if (!$('#scrim').classList.contains('hidden')) return closeModal();
      if (!$('#ctx').classList.contains('hidden')) return hideCtx();
      if (typing) return e.target.blur();
      if (sel) { sel = null; renderDetail(); renderList(); renderChart(true); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); return e.shiftKey ? redo() : undo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); return redo(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); return exportJSON(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); return window.print(); }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('#rail').classList.add('open'); $('#q').focus(); $('#q').select(); return; }
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); return dlgAddPerson(); }
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); return fitView(); }
    if (e.key === 'h' || e.key === 'H') { e.preventDefault(); return centreOn(T.focus, 1); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); return zoomBy(1.25); }
    if (e.key === '-' || e.key === '_') { e.preventDefault(); return zoomBy(0.8); }
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); return confirmDelete(sel); }
  });
  window.addEventListener('beforeunload', persistNow);
}
function setTheme(mode) {
  prefs.theme = mode; savePrefs();
  document.documentElement.setAttribute('data-theme', mode);
  $('#btn-theme').innerHTML = '<svg><use href="#i-' + (mode === 'dark' ? 'sun' : 'moon') + '"/></svg>';
  if (CHART) renderChart(true);
}

/* ─── boot ────────────────────────────────────────────────────────────── */
(function boot() {
  loadPrefs();
  if (!prefs.theme) prefs.theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', prefs.theme);

  const idx = treeIndex();
  let loaded = false;
  if (idx.length) {
    const raw = localStorage.getItem(LS_TREE + idx[0].id);
    if (raw) { try { T = normaliseTree(JSON.parse(raw)); loaded = true; } catch (e) {} }
  }
  if (!loaded) T = blankTree();

  $$('#mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === prefs.mode));
  $('#opt-sibs').checked = prefs.sibs;
  $('#opt-ghosts').checked = prefs.ghosts;

  reindex();
  wire();
  setTheme(prefs.theme);
  renderAll(true);
  fitView();
  if (!Object.keys(T.people).length) $('#stage-empty').classList.remove('hidden');
})();
</script>
</body>
</html>
